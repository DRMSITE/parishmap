name: DCO

# Every commit in a pull request must carry a "Signed-off-by:" line (git commit -s).
# See CONTRIBUTING.md.

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    name: Commits are signed off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check each commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for commit in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$commit" | grep -qE '^Signed-off-by: .+ <.+>'; then
              echo "Missing Signed-off-by: $commit"
              missing=1
            fi
          done
          exit $missing
