name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The runner is pinned: ubuntu-latest has begun moving to Ubuntu 26.04, where the Playwright
# system-package install stalls. Move to a newer release only after trying it.
jobs:
  checks:
    name: Types, lint, unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run licences:check
      # The Cloud Functions have their own lock file and are deployed as they stand. The
      # site's own dependencies are not gated: its only high findings come from the Firebase
      # client's gRPC, where the offered fix is a downgrade.
      - run: npm --prefix functions ci
      - run: npm --prefix functions audit --omit=dev --audit-level=high
      # A normal build, as deployed, with nothing in it that should not be public.
      - run: npm run build
      - run: npm run check:dist

  e2e:
    name: Browser tests and accessibility
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7

  rules:
    name: Firestore rules (emulator)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm install --global firebase-tools
      - run: npm run test:rules
